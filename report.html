<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Отчёт о работе за день — Плановые / Внеплановые работы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #eef2f7;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 25px 28px 40px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e2a3e;
            border-left: 5px solid #2c7da0;
            padding-left: 18px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            font-weight: 600;
            color: #0f2b3d;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        label i {
            color: #2c7da0;
            width: 22px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cfdfe9;
            border-radius: 16px;
            font-size: 1rem;
            background: #fefefe;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }
        
        /* Стили для выбора типа работ */
        .work-type-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #f0f4f8;
            border-radius: 20px;
        }
        .work-type-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            background: white;
            border: 1px solid #cfdfe9;
            transition: 0.2s;
        }
        .work-type-option.selected {
            background: #2c7da0;
            border-color: #2c7da0;
            color: white;
        }
        .work-type-option.selected i {
            color: white;
        }
        .work-type-option input {
            width: auto;
            margin: 0;
            transform: scale(1.1);
            accent-color: #2c7da0;
        }
        .work-type-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }
        
        .works-container {
            background: #f9fbfd;
            border-radius: 20px;
            padding: 15px 15px 5px 15px;
            border: 1px solid #e2edf2;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #2c7da0;
        }
        .section-header i {
            font-size: 1.2rem;
            color: #2c7da0;
        }
        .section-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e2a3e;
        }
        .section-header .badge {
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: normal;
        }
        .work-item {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 6px 12px 6px 16px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }
        .work-item textarea {
            flex: 1;
            border-radius: 16px;
            resize: vertical;
            font-size: 0.95rem;
            padding: 8px 12px;
        }
        .work-item .remove-work {
            background: #ffe6e5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 40px;
            cursor: pointer;
            color: #c2412c;
            font-size: 0.9rem;
        }
        .add-work-btn {
            background: none;
            border: 1px dashed #2c7da0;
            color: #2c7da0;
            padding: 10px;
            border-radius: 40px;
            width: 100%;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .photo-area {
            background: #f9fbfd;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #e2edf2;
        }
        .photo-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .photo-card {
            position: relative;
            aspect-ratio: 3 / 4;
            border-radius: 12px;
            overflow: hidden;
            background: #f1f5f9;
            border: 1px solid #cbdbe2;
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-card .delete-photo {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.65);
            color: white;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .photo-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .camera-btn, .file-btn {
            background: #eef2fa;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid #e0edf2;
        }
        .btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-primary { background: #1e5f7a; color: white; }
        .btn-secondary { background: #e9ecef; color: #1e2a3e; border: 1px solid #cfdfe9; }
        .btn-telegram { background: #27a7e7; color: white; }
        .btn-lang { background: #2c7da0; color: white; }
        .btn-archive { background: #475569; color: white; }
        .btn-archive-outline { background: white; border: 1px solid #475569; color: #1e293b; }
        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 28px;
            background: #f0f9ff;
            color: #0369a1;
            text-align: center;
            font-size: 0.85rem;
        }
        @media (max-width: 640px) {
            .photo-preview-grid { grid-template-columns: repeat(2, 1fr); }
            .action-buttons { flex-direction: column; }
            .work-type-selector { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-clipboard-list"></i> Отчёт о работе за день</h1>

    <div class="form-group">
        <label><i class="far fa-calendar-alt"></i> Дата отчёта</label>
        <input type="date" id="reportDate">
    </div>
    <div class="form-group">
        <label><i class="fas fa-charging-station"></i> Подстанция / Объект</label>
        <input type="text" id="substationName" placeholder="ПС-110 'Северная'" autocomplete="off">
    </div>

    <!-- Выбор типа работ: Плановые / Внеплановые -->
    <!-- <div class="form-group">
        <label><i class="fas fa-tasks"></i> Тип добавляемой работы</label>
        <div class="work-type-selector" id="workTypeSelector">
            <div class="work-type-option selected" data-type="planned">
                <i class="fas fa-calendar-check"></i>
                <span>📋 Плановая</span>
            </div>
            <div class="work-type-option" data-type="unplanned">
                <i class="fas fa-exclamation-triangle"></i>

        </div>

    <!-- Плановые работы -->
    <div class="form-group">
        <div class="section-header">
            <i class="fas fa-calendar-check"></i>
            <h3>ПЛАНОВЫЕ РАБОТЫ</h3>
            <span class="badge" id="plannedCount">0</span>
        </div>
        <div class="works-container">
            <div id="plannedWorksList"></div>
            <button type="button" class="add-work-btn" data-type="planned"><i class="fas fa-plus-circle"></i> Добавить плановую работу</button>
        </div>
    </div>

    <!-- Внеплановые работы -->
    <div class="form-group">
        <div class="section-header">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>ВНЕПЛАНОВЫЕ РАБОТЫ</h3>
            <span class="badge" id="unplannedCount">0</span>
        </div>
        <div class="works-container">
            <div id="unplannedWorksList"></div>
            <button type="button" class="add-work-btn" data-type="unplanned"><i class="fas fa-plus-circle"></i> Добавить внеплановую работу</button>
        </div>
    </div>

    <div class="form-group">
        <label><i class="fas fa-camera"></i> Фото</label>
        <div class="photo-area">
            <div class="photo-preview-grid" id="photoPreviewGrid"></div>
            <div class="photo-input-group">
                <button type="button" id="cameraInputBtn" class="camera-btn"><i class="fas fa-camera-retro"></i> Снять фото</button>
                <button type="button" id="fileInputBtn" class="file-btn"><i class="fas fa-image"></i> Выбрать несколько фото</button>
                <input type="file" id="hiddenFileInput" accept="image/*" multiple style="display:none">
                <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" style="display:none">
            </div>
        </div>
    </div>

    <div class="action-buttons" style="border-top: 1px dashed #cbd5e1;">
        <button id="saveArchiveBtn" class="btn btn-archive"><i class="fas fa-archive"></i> Сохранить архив</button>
        <button id="loadArchiveBtn" class="btn btn-archive-outline"><i class="fas fa-folder-open"></i> Загрузить архив</button>
        <input type="file" id="archiveFileInput" accept=".json" style="display:none">
    </div>

    <div class="action-buttons">
        <button id="exportDocBtn" class="btn btn-primary"><i class="fas fa-file-word"></i> .DOC (компактный)</button>
        <button id="telegramBtn" class="btn btn-telegram"><i class="fab fa-telegram-plane"></i> В Telegram</button>
        <button id="translateBtn" class="btn btn-lang"><i class="fas fa-language"></i> Перевести на румынский</button>
    </div>
    <div id="statusMsg" class="status-msg">✅ Готово. Работы разделены на плановые и внеплановые.</div>
</div>

<script>
    // ---------- ДАННЫЕ ----------
    let plannedWorks = [''];      // плановые работы
    let unplannedWorks = [''];    // внеплановые работы
    let photosArray = [];

    // DOM
    const plannedWorksListDiv = document.getElementById('plannedWorksList');
    const unplannedWorksListDiv = document.getElementById('unplannedWorksList');
    const plannedCountSpan = document.getElementById('plannedCount');
    const unplannedCountSpan = document.getElementById('unplannedCount');
    const photoPreviewGrid = document.getElementById('photoPreviewGrid');
    const hiddenFileInput = document.getElementById('hiddenFileInput');
    const hiddenCameraInput = document.getElementById('hiddenCameraInput');
    const cameraBtn = document.getElementById('cameraInputBtn');
    const fileBtn = document.getElementById('fileInputBtn');
    const reportDateInput = document.getElementById('reportDate');
    const substationInput = document.getElementById('substationName');
    const translateBtn = document.getElementById('translateBtn');
    const statusDiv = document.getElementById('statusMsg');
    const saveArchiveBtn = document.getElementById('saveArchiveBtn');
    const loadArchiveBtn = document.getElementById('loadArchiveBtn');
    const archiveFileInput = document.getElementById('archiveFileInput');

    // Переключение типа для визуального эффекта
    let currentSelectedType = 'planned';
    document.querySelectorAll('.work-type-option').forEach(opt => {
        opt.addEventListener('click', () => {
            document.querySelectorAll('.work-type-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            currentSelectedType = opt.dataset.type;
        });
    });

    function showStatus(msg, isError = false) {
        statusDiv.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
        statusDiv.style.background = isError ? '#ffe6e5' : '#e0f2fe';
        statusDiv.style.color = isError ? '#b91c1c' : '#0369a1';
        setTimeout(() => {
            statusDiv.style.background = '#f0f9ff';
            statusDiv.style.color = '#0369a1';
            statusDiv.innerHTML = '✅ Готово.';
        }, 4000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    function updateCounters() {
        plannedCountSpan.textContent = plannedWorks.filter(w => w.trim() !== '').length;
        unplannedCountSpan.textContent = unplannedWorks.filter(w => w.trim() !== '').length;
    }

    // ----- ПЛАНОВЫЕ РАБОТЫ -----
    function renderPlannedWorks() {
        plannedWorksListDiv.innerHTML = '';
        if (plannedWorks.length === 0) plannedWorks = [''];
        plannedWorks.forEach((text, idx) => {
            const div = document.createElement('div');
            div.className = 'work-item';
            const textarea = document.createElement('textarea');
            textarea.rows = 2;
            textarea.placeholder = `Плановая работа ${idx+1}...`;
            textarea.value = text;
            textarea.addEventListener('input', (e) => { plannedWorks[idx] = e.target.value; updateCounters(); });
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-work';
            removeBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            removeBtn.onclick = () => {
                if (plannedWorks.length > 1) {
                    plannedWorks.splice(idx, 1);
                    renderPlannedWorks();
                } else {
                    plannedWorks[0] = '';
                    renderPlannedWorks();
                }
                updateCounters();
            };
            div.appendChild(textarea);
            div.appendChild(removeBtn);
            plannedWorksListDiv.appendChild(div);
        });
        updateCounters();
    }

    function addPlannedWork() {
        plannedWorks.push('');
        renderPlannedWorks();
    }

    // ----- ВНЕПЛАНОВЫЕ РАБОТЫ -----
    function renderUnplannedWorks() {
        unplannedWorksListDiv.innerHTML = '';
        if (unplannedWorks.length === 0) unplannedWorks = [''];
        unplannedWorks.forEach((text, idx) => {
            const div = document.createElement('div');
            div.className = 'work-item';
            const textarea = document.createElement('textarea');
            textarea.rows = 2;
            textarea.placeholder = `Внеплановая работа ${idx+1}...`;
            textarea.value = text;
            textarea.addEventListener('input', (e) => { unplannedWorks[idx] = e.target.value; updateCounters(); });
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-work';
            removeBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            removeBtn.onclick = () => {
                if (unplannedWorks.length > 1) {
                    unplannedWorks.splice(idx, 1);
                    renderUnplannedWorks();
                } else {
                    unplannedWorks[0] = '';
                    renderUnplannedWorks();
                }
                updateCounters();
            };
            div.appendChild(textarea);
            div.appendChild(removeBtn);
            unplannedWorksListDiv.appendChild(div);
        });
        updateCounters();
    }

    function addUnplannedWork() {
        unplannedWorks.push('');
        renderUnplannedWorks();
    }

    // Автоматическое добавление при заполнении последнего поля (для обоих списков)
    function bindAutoAdd() {
    //    plannedWorksListDiv.addEventListener('input', (e) => {
    //        if (e.target?.tagName === 'TEXTAREA') {
    //            const textareas = Array.from(plannedWorksListDiv.querySelectorAll('textarea'));
    //            const last = textareas[textareas.length - 1];
    //            if (e.target === last && e.target.value.trim() !== '') {
    //                addPlannedWork();
    //            }
    //            textareas.forEach((ta, i) => { if (plannedWorks[i] !== undefined) plannedWorks[i] = ta.value; });
    //            updateCounters();
    //        }
    //    });
    //    
    //    unplannedWorksListDiv.addEventListener('input', (e) => {
    //        if (e.target?.tagName === 'TEXTAREA') {
    //            const textareas = Array.from(unplannedWorksListDiv.querySelectorAll('textarea'));
    //            const last = textareas[textareas.length - 1];
    //            if (e.target === last && e.target.value.trim() !== '') {
    //                addUnplannedWork();
    //            }
    //            textareas.forEach((ta, i) => { if (unplannedWorks[i] !== undefined) unplannedWorks[i] = ta.value; });
    //            updateCounters();
    //        }
    //    });
    }

    // ----- ФОТО -----
    function addPhoto(base64) {
        photosArray.push(base64);
        renderPhotos();
    }

    function addMultiplePhotos(files) {
        for (let f of files) fileToBase64(f, b64 => { photosArray.push(b64); renderPhotos(); });
    }

    function removePhoto(idx) {
        photosArray.splice(idx, 1);
        renderPhotos();
    }

    function renderPhotos() {
        photoPreviewGrid.innerHTML = '';
        if (photosArray.length === 0) {
            photoPreviewGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:10px;">📸 Нет фото</div>';
            return;
        }
        photosArray.forEach((b64, i) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            const img = document.createElement('img');
            img.src = b64;
            const del = document.createElement('div');
            del.className = 'delete-photo';
            del.innerHTML = '<i class="fas fa-times-circle"></i>';
            del.onclick = () => removePhoto(i);
            card.appendChild(img);
            card.appendChild(del);
            photoPreviewGrid.appendChild(card);
        });
    }

    function fileToBase64(file, cb) {
        const reader = new FileReader();
        reader.onload = () => cb(reader.result);
        reader.readAsDataURL(file);
    }

    fileBtn.onclick = () => hiddenFileInput.click();
    hiddenFileInput.onchange = (e) => {
        if (e.target.files?.length) addMultiplePhotos(Array.from(e.target.files));
        hiddenFileInput.value = '';
    };
    cameraBtn.onclick = () => hiddenCameraInput.click();
    hiddenCameraInput.onchange = (e) => {
        if (e.target.files?.[0]) fileToBase64(e.target.files[0], addPhoto);
        hiddenCameraInput.value = '';
    };

    // ----- ПЕРЕВОД -----
    async function translateText(text, targetLang = 'ro') {
    	if (!text?.trim()) return text;
    
    	const apiKey = 'AQVNz8lDDYy4mDBowCo60xLqawh_dLvU27belobo';           // ← сюда скопированный ключ
    	const folderId = 'ajeefkmcb6t8cnsin78b'; // ← ваш Folder ID
    
    	try {
        	const response = await fetch('https://translate.api.cloud.yandex.net/translate/v2/translate', {
            	method: 'POST',
            	headers: {
                	'Authorization': `Api-Key ${apiKey}`,
                	'Content-Type': 'application/json'
            	},
            	body: JSON.stringify({
                	sourceLanguageCode: 'ru',
                	targetLanguageCode: targetLang,
                	texts: [text],
                	folderId: folderId
            	})
        	});
        
        	const data = await response.json();
        	return data.translations[0].text;
    		} catch (error) {
        	console.error('Ошибка перевода:', error);
        	return text;
    	}
	}

    async function translateAll() {
        showStatus("🔄 Выполняется перевод...");
        let translatedCount = 0;
        
        const sub = substationInput.value.trim();
        if (sub) {
            const translated = await translateText(sub);
            if (translated) { substationInput.value = translated; translatedCount++; }
        }
        
        for (let i = 0; i < plannedWorks.length; i++) {
            if (plannedWorks[i]?.trim()) {
                const translated = await translateText(plannedWorks[i]);
                if (translated) { plannedWorks[i] = translated; translatedCount++; }
            }
        }
        for (let i = 0; i < unplannedWorks.length; i++) {
            if (unplannedWorks[i]?.trim()) {
                const translated = await translateText(unplannedWorks[i]);
                if (translated) { unplannedWorks[i] = translated; translatedCount++; }
            }
        }
        
        renderPlannedWorks();
        renderUnplannedWorks();
        
        if (translatedCount > 0) {
            showStatus(`✅ Переведено ${translatedCount} элементов.`);
        } else {
            const allText = [substationInput.value, ...plannedWorks, ...unplannedWorks].join('\n');
            await navigator.clipboard.writeText(allText);
            showStatus(`❌ Перевод недоступен. Текст скопирован в буфер.`, true);
        }
    }

    // ----- ГЕНЕРАЦИЯ HTML ДЛЯ DOC -----
    function buildExportHTML() {
        const dateVal = reportDateInput.value || 'Дата не указана';
        const substation = substationInput.value.trim() || 'Не указана';
        
        // Плановые работы
        const plannedList = plannedWorks.filter(w => w.trim() !== '').map((w, i) => 
            `<li style="margin-bottom: 2px; line-height: 1.0;"><strong>${i+1}.</strong> ${escapeHtml(w)}</li>`
        ).join('');
        const plannedHtml = plannedList ? `<ul style="margin-top: 6px; margin-bottom: 6px; padding-left: 10px;">${plannedList}</ul>` : '<p style="margin: 6px 0; color: #666;">Нет плановых работ</p>';
        
        // Внеплановые работы
        const unplannedList = unplannedWorks.filter(w => w.trim() !== '').map((w, i) => 
            `<li style="margin-bottom: 2px; line-height: 1.0;"><strong>${i+1}.</strong> ${escapeHtml(w)}</li>`
        ).join('');
        const unplannedHtml = unplannedList ? `<ul style="margin-top: 6px; margin-bottom: 6px; padding-left: 10px;">${unplannedList}</ul>` : '<p style="margin: 6px 0; color: #666;">Нет внеплановых работ</p>';
        
        // Фото
        let photosTable = '';
        if (photosArray.length > 0) {
            const cols = 3;
            const rows = Math.ceil(photosArray.length / cols);
            photosTable = `<h4 style="margin: 10px 0 6px 0;">📷 Фотоотчёт (4.5×6 см):</h4>
            <table border="0" cellpadding="4" cellspacing="0" style="width:100%; border-collapse:collapse;">`;
            for (let i = 0; i < rows; i++) {
                photosTable += '<tr>';
                for (let j = 0; j < cols; j++) {
                    const idx = i * cols + j;
                    if (idx < photosArray.length) {
                        photosTable += `<td style="width:4.5cm; text-align:center; padding: 4px;">
                            <img src="${photosArray[idx]}" style="width:4.5cm; height:6cm; object-fit:cover; border-radius:6px;">
                        </td>`;
                    } else {
                        photosTable += '<td style="width:4.5cm; padding: 4px;"></td>';
                    }
                }
                photosTable += '</tr>';
            }
            photosTable += '</table>';
        } else {
            photosTable = '<p style="margin: 6px 0;">Fotografiile nu sunt atașate</p>';
        }

        return `<!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>Raport Zilnic Muncă</title>
        <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; line-height: 0.8; font-size: 11pt; }
            h2 { color: #1e4663; border-bottom: 2px solid #2c7da0; padding-bottom: 4px; margin: 0 0 12px 0; font-size: 18pt; }
            .info p { margin: 4px 0; line-height: 1.3; }
            .works { background: #f4f9fe; padding: 8px 12px; border-radius: 12px; margin: 12px 0; }
            .works h3 { margin: 0 0 6px 0; font-size: 12pt; display: flex; align-items: center; gap: 8px; }
            .footer { margin-top: 20px; font-size: 9pt; color: gray; text-align:center; }
            table { width: 100%; margin: 0; }
            td { padding: 4px; }
            h4 { margin: 8px 0 4px 0; font-size: 11pt; }
            .planned-icon { color: #2c7da0; }
            .unplanned-icon { color: #e67e22; }
        </style>
        </head>
        <body>
        <h2>RAPORTUL ZILNIC DE MUNCĂ</h2>
        <div class="info">
            <p><strong>📅 Data raportului:</strong> ${escapeHtml(dateVal)}</p>
            <p><strong>⚡ Stația / Obiectivul:</strong> ${escapeHtml(substation)}</p>
        </div>
        
        <div class="works">
            <h3><i class="planned-icon">📋</i> LUCRĂRI EFECTUATE IN BAZA PLANULUI DE MENTENANTA</h3>
            ${plannedHtml}
        </div>
        
        <div class="works">
            <h3><i class="unplanned-icon">⚠️</i> LUCRĂRI NEPLANIFICATE</h3>
            ${unplannedHtml}
        </div>
        
        ${photosTable}
        <div class="footer"><p>Document generat automat • ${new Date().toLocaleString()}</p></div>
        </body>
        </html>`;
    }

    // ----- ЭКСПОРТ .DOC -----
    function exportDoc() {
        const html = buildExportHTML();
        const blob = new Blob([html], { type: 'application/msword' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `raport_${reportDateInput.value || 'today'}.doc`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showStatus("✅ .DOC сохранён — плановые и внеплановые работы разделены");
    }

    function shareTelegram() {
        const html = buildExportHTML();
        const blob = new Blob([html], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `telegram_report_${reportDateInput.value || 'report'}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showStatus("📎 Файл скачан. Отправьте в Telegram через меню 'Файл'.");
    }

    // ----- АРХИВ -----
    function saveArchive() {
        const data = {
            date: reportDateInput.value,
            substation: substationInput.value,
            plannedWorks: plannedWorks.filter(w => w !== undefined),
            unplannedWorks: unplannedWorks.filter(w => w !== undefined),
            photos: photosArray,
            savedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `archive_${reportDateInput.value || 'backup'}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        showStatus(`📦 Архив сохранён (план:${plannedWorks.length-1}, внеплан:${unplannedWorks.length-1}, фото:${photosArray.length})`);
    }

    function loadArchive(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const d = JSON.parse(e.target.result);
                if (d.date) reportDateInput.value = d.date;
                if (d.substation) substationInput.value = d.substation;
                plannedWorks = (d.plannedWorks?.length ? d.plannedWorks : ['']);
                unplannedWorks = (d.unplannedWorks?.length ? d.unplannedWorks : ['']);
                photosArray = d.photos || [];
                renderPlannedWorks();
                renderUnplannedWorks();
                renderPhotos();
                showStatus(`✅ Архив загружен: плановых ${plannedWorks.length-1}, внеплановых ${unplannedWorks.length-1}, фото ${photosArray.length}`);
            } catch { showStatus("Ошибка архива", true); }
        };
        reader.readAsText(file);
    }

    loadArchiveBtn.onclick = () => archiveFileInput.click();
    archiveFileInput.onchange = e => { if (e.target.files?.[0]) loadArchive(e.target.files[0]); archiveFileInput.value = ''; };

    // ----- ИНИЦИАЛИЗАЦИЯ -----
    function init() {
        reportDateInput.value = new Date().toISOString().slice(0,10);
        renderPlannedWorks();
        renderUnplannedWorks();
        bindAutoAdd();
        
        document.querySelectorAll('.add-work-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.type === 'planned') addPlannedWork();
                else addUnplannedWork();
            });
        });
        
        document.getElementById('exportDocBtn').onclick = exportDoc;
        document.getElementById('telegramBtn').onclick = shareTelegram;
        translateBtn.onclick = translateAll;
        saveArchiveBtn.onclick = saveArchive;
        renderPhotos();
    }
    init();
</script>
</body>
</html>
